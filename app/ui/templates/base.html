<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PyRailSolver{% endblock %}</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('prs-theme') || 'light');</script>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/">&#x1F686; PyRailSolver</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarMain" aria-controls="navbarMain"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav ms-auto me-2">
          <li class="nav-item">
            <a class="nav-link" href="/">Maps</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/editor">Editor</a>
          </li>
        </ul>
        <button id="theme-toggle"
                class="btn btn-sm btn-outline-light border-0 fs-6 px-2"
                title="Switch to dark mode"
                aria-label="Toggle colour theme">&#9790;</button>
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.6.2/dist/panzoom.min.js"
          integrity="sha384-irdz3GZoyr9anVd5nSLy63Z39tLtMTNQFFKxhx/KM08C8NkKpZre6M/m4QCUeeB3"
          crossorigin="anonymous"></script>
  {% block scripts %}{% endblock %}
  <script>
    (function () {
      var btn  = document.getElementById('theme-toggle');
      function sync(t) {
        btn.innerHTML  = t === 'dark' ? '&#9728;' : '&#9790;';
        btn.title      = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
        btn.setAttribute('aria-pressed', t === 'dark');
      }
      sync(document.documentElement.getAttribute('data-bs-theme') || 'light');
      btn.addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', next);
        localStorage.setItem('prs-theme', next);
        sync(next);
      });
    })();
  </script>
</body>
</html>
